<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLTV HOME</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif;text-align:center;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(1100px,94vw);padding:28px 24px}
.logo{font-size:clamp(42px,6vw,70px);font-weight:700;letter-spacing:clamp(6px,1vw,11px);line-height:1;margin-bottom:10px}
.sub{color:#999;letter-spacing:clamp(2px,.55vw,5px);font-size:clamp(11px,1.5vw,16px);margin-bottom:42px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:920px;margin:0 auto}
a.btn{min-height:125px;padding:24px 18px;background:linear-gradient(180deg,#292929 0%,#111 100%);border:1px solid #4a4a4a;border-radius:10px;color:#fff;text-decoration:none;font-size:clamp(21px,2.6vw,31px);font-weight:700;display:flex;align-items:center;justify-content:center;gap:18px;letter-spacing:.5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 5px 18px rgba(0,0,0,.35);transition:transform .12s ease,background .12s ease,border-color .12s ease}
a.btn:hover{background:linear-gradient(180deg,#353535 0%,#181818 100%);border-color:#777;transform:scale(1.015)}
a.btn:active{transform:scale(.99)}
.icon{font-size:1.25em;line-height:1;min-width:1.2em}
.foot{margin-top:36px;color:#666;font-size:12px;letter-spacing:3px}
@media(max-width:600px){body{overflow:auto}.wrap{padding:24px 16px}.sub{margin-bottom:28px}.grid{grid-template-columns:1fr;gap:14px}a.btn{min-height:92px;font-size:22px}.foot{margin-top:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SLTV</div>
  <div class="sub">HOME • SECOND LIFE</div>

  <div class="grid">
    <a class="btn" href="canali.html"><span class="icon">📺</span><span>CANALI TV</span></a>
    <a class="btn" href="cinema.html"><span class="icon">🎬</span><span>CINEMA</span></a>
    <a class="btn" href="news.html"><span class="icon">📰</span><span>NEWS</span></a>
    <a class="btn" href="web.html"><span class="icon">🌐</span><span>WEB</span></a>
  </div>

  <div class="foot">SLTV • PERSONAL MEDIA CENTER</div>
</div>
</body>
</html>
