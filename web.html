<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLTV - Web</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  background:#020a16;
  color:#f4f8ff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
  position:relative;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 8% 58%,rgba(0,133,255,.24),transparent 27%),
    radial-gradient(circle at 90% 38%,rgba(0,96,220,.18),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(0,88,255,.10),transparent 35%),
    linear-gradient(145deg,transparent 52%,rgba(0,139,255,.07) 53%,transparent 55%);
}
.wrap{
  width:100%;min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:2.5vh 4vw;position:relative;
}
.header{text-align:center;margin-bottom:2.8vh}
.title{
  margin:0;font-size:clamp(36px,4.8vw,66px);
  font-weight:800;letter-spacing:5px;
  text-shadow:0 0 18px rgba(0,151,255,.25);
}
.title .globe{font-size:.78em;vertical-align:middle;margin-right:12px;color:#14bfff}
.subtitle{
  margin-top:9px;color:#91d2ff;
  font-size:clamp(10px,1.15vw,16px);
  letter-spacing:5px;
}
.line{
  width:min(640px,72vw);height:1px;margin:12px auto 0;
  background:linear-gradient(90deg,transparent,#168fff,transparent);
  box-shadow:0 0 10px #1260a0;
}
.grid{
  width:min(980px,88vw);
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.card{
  min-height:clamp(155px,20vh,215px);
  border:1px solid #238dff;border-radius:15px;
  background:linear-gradient(145deg,#17293c,#07111d);
  color:#fff;text-decoration:none;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),
             0 9px 28px rgba(0,0,0,.48);
  transition:.15s;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,rgba(35,157,255,.15),transparent 60%);
}
.card:hover{
  transform:translateY(-2px);
  border-color:#70c5ff;
  box-shadow:0 0 24px rgba(24,142,255,.25),
             inset 0 1px 0 rgba(255,255,255,.15);
}
.mark{
  height:74px;min-width:120px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;position:relative;
  font-weight:800;
}
.google{
  width:78px;min-width:78px;height:78px;border-radius:50%;
  font-size:60px;font-family:Arial,sans-serif;
  background:conic-gradient(from -45deg,#4285f4 0 25%,#34a853 25% 50%,#fbbc05 50% 72%,#ea4335 72% 100%);
  color:#fff;
  text-shadow:2px 0 0 #4285f4,-2px 0 0 #ea4335;
  display:flex;align-items:center;justify-content:center;
}
.google:after{
  content:"G";background:#07111d;border-radius:50%;
  width:56px;height:56px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:49px;font-weight:700;
}
.bing{
  width:82px;min-width:82px;height:82px;
  font-size:62px;color:#1fb5ff;font-weight:800;
  font-family:Arial,sans-serif;
  text-shadow:0 4px 0 #0878b8;
  transform:skew(-7deg);
}
.yahoo{
  min-width:170px;height:70px;border-radius:50%;
  background:linear-gradient(145deg,#8a19d8,#4e008e);
  color:#fff;font-family:Georgia,serif;font-size:43px;
  box-shadow:0 0 16px rgba(153,38,235,.28);
}
.duck{
  width:82px;min-width:82px;height:82px;border-radius:50%;
  background:#ef5a24;color:#fff;
  font-size:38px;font-weight:900;
  border:5px solid #fff;
  text-shadow:0 2px 0 #8f2c0e;
}
.duck:after{content:"🦆";font-size:47px}
.duck{font-size:0}
.name{
  font-size:clamp(18px,1.8vw,27px);
  font-weight:800;letter-spacing:1px;position:relative;
}
.desc{
  margin-top:8px;color:#9bd8ff;
  font-size:clamp(10px,1vw,14px);
  letter-spacing:2px;position:relative;
}
.home{
  margin-top:2.7vh;padding: 18px 52px;
  border:1px solid #318fff;border-radius:10px;
  background:linear-gradient(#182a3a,#09121b);
  color:#fff;text-decoration:none;font-weight:700;
  letter-spacing:2px;box-shadow:0 7px 18px rgba(0,0,0,.42);
}
.home:hover{border-color:#7acaff}
@media(max-width:700px){
  body{overflow:auto}
  .wrap{padding:18px}
  .grid{grid-template-columns:1fr;gap:11px}
  .card{min-height:130px}
  .mark{transform:scale(.82);margin-bottom:-2px}
  .name{font-size:16px}.desc{font-size:9px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <h1 class="title"><span class="globe">🌐</span>WEB</h1>
    <div class="subtitle">ESPLORA IL MONDO SENZA CONFINI</div>
    <div class="line"></div>
  </header>

  <main class="grid">
    <a class="card" href="https://www.google.com/">
      <div class="mark google"></div>
      <div class="name">Google</div>
      <div class="desc">CERCA NEL MONDO</div>
    </a>

    <a class="card" href="https://www.bing.com/">
      <div class="mark bing">b</div>
      <div class="name">Bing</div>
      <div class="desc">NUOVE PROSPETTIVE</div>
    </a>

    <a class="card" href="https://search.yahoo.com/">
      <div class="mark yahoo">Y!</div>
      <div class="name">Yahoo!</div>
      <div class="desc">INFORMAZIONI, SEMPRE</div>
    </a>

    <a class="card" href="https://duckduckgo.com/">
      <div class="mark duck"></div>
      <div class="name">DuckDuckGo</div>
      <div class="desc">LA TUA PRIVACY PRIMA DI TUTTO</div>
    </a>
  </main>

  <a class="home" href="index.html">⌂ &nbsp; HOME</a>
</div>
</body>
</html>
